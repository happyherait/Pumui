services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: pumui_admin
      APP_USER: pumui
      APP_USER_PASSWORD: pumui
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 40
    volumes:
      - oracle-data:/opt/oracle/oradata
volumes:
  oracle-data:
